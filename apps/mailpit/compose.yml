services:
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_UI_AUTH: "${MAIL_USER}:${MAIL_PASSWORD}"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_DATABASE: /data/mailpit.db
    volumes:
      - data:/data
    x-provelox:
      expose: true
      port: 8025
volumes:
  data:
