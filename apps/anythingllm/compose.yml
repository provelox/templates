services:
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    restart: unless-stopped
    environment:
      STORAGE_DIR: /app/server/storage
      AUTH_TOKEN: ${AUTH_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - storage:/app/server/storage
    x-provelox:
      expose: true
      port: 3001
volumes:
  storage:
