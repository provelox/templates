    description: Scan, index and search your documents. Includes PostgreSQL and Redis, and an admin account created for you.
    category: Productivity
    mainService: paperless
    port: 8000
    publicWeb: true
    variables:
      - key: PAPERLESS_URL
        label: Public address
        description: The address it will be opened at, for example https://docs.example.com
        kind: text
      - key: ADMIN_USER
        label: Admin username
        default: admin
        kind: text
      - key: ADMIN_PASSWORD
        label: Admin password
        kind: secret
      - key: SECRET_KEY
        label: Secret key
        kind: secret
      - *a1
    icon: https://templates.provelox.com/icons/paperlessngx.svg
    composeFile: apps/paperless-ngx/compose.yml
  - id: wikijs
    name: Wiki.js
    description: "A modern wiki for documentation and team knowledge, on PostgreSQL. Open it right after deploying: the first visitor sets it up."
    category: Productivity
    mainService: wiki
    port: 3000
