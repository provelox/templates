    composeFile: apps/nextcloud/compose.yml
  - id: mattermost
    name: Mattermost
    description: "Team chat with channels, threads and file sharing, on PostgreSQL. Open it right after deploying: the first visitor sets it up."
    category: Productivity
    mainService: mattermost
    port: 8065
    publicWeb: true
    variables:
      - *a1
    icon: https://templates.provelox.com/icons/mattermost.svg
    composeFile: apps/mattermost/compose.yml
  - id: paperless-ngx
