# Provelox templates: ready-made apps you deploy from the Templates page of a Provelox server.
#
# Add this repository as a Git template registry (Settings → Template registries → Git repository), or read this file
# straight from GitHub. Each template's Compose file is in apps/<id>/compose.yml. Logos under icons/ are served from
# GitHub Pages.
#
# Every password and secret key is a "secret" variable: Provelox generates it when someone deploys.
# Check the file with: npm run validate
name: Provelox templates
templates:
  - id: postgres
    name: PostgreSQL
    description: The popular relational database. Data is kept on a volume that survives redeploys.
    category: Database
    mainService: postgres
    port: 5432
    connect: postgresql://{POSTGRES_USER}:{POSTGRES_PASSWORD}@{host}:{port}/{POSTGRES_DB}
    publicWeb: false
    variables:
      - key: POSTGRES_USER
        label: Username
        default: postgres
        kind: text
      - key: POSTGRES_DB
        label: Database name
        default: app
        kind: text
      - key: POSTGRES_PASSWORD
        label: Password
        kind: secret
    icon: https://templates.provelox.com/icons/postgresql.svg
    composeFile: apps/postgres/compose.yml
  - id: redis
    name: Redis
    description: In-memory data store for caches, queues and sessions, with a password and on-disk persistence.
    category: Database
    mainService: redis
    port: 6379
    connect: redis://:{REDIS_PASSWORD}@{host}:{port}
    publicWeb: false
    variables:
      - key: REDIS_PASSWORD
        label: Password
        kind: secret
    icon: https://templates.provelox.com/icons/redis.svg
    composeFile: apps/redis/compose.yml
  - id: mysql
    name: MySQL
    description: MySQL 8.4 with a database created for you. Data is kept on a volume.
    category: Database
    mainService: mysql
    port: 3306
    connect: mysql://root:{MYSQL_ROOT_PASSWORD}@{host}:{port}/{MYSQL_DATABASE}
    publicWeb: false
    variables:
      - key: MYSQL_DATABASE
        label: Database name
        default: app
        kind: text
      - key: MYSQL_ROOT_PASSWORD
        label: Root password
        kind: secret
    icon: https://templates.provelox.com/icons/mysql.svg
    composeFile: apps/mysql/compose.yml
  - id: mongodb
    name: MongoDB
    description: Document database with an admin user. Data is kept on a volume.
    category: Database
    mainService: mongo
    port: 27017
    connect: mongodb://{MONGO_USER}:{MONGO_PASSWORD}@{host}:{port}
    publicWeb: false
    variables:
      - key: MONGO_USER
        label: Admin username
        default: admin
        kind: text
      - key: MONGO_PASSWORD
        label: Admin password
        kind: secret
    icon: https://templates.provelox.com/icons/mongodb.svg
    composeFile: apps/mongodb/compose.yml
  - id: rustfs
    name: RustFS
    description: S3-compatible object storage with a web console. Other apps use the S3 API on port 9000.
    category: Storage
    mainService: rustfs
    port: 9000
    connect: http://{host}:{port}
    publicWeb: true
    variables:
      - key: RUSTFS_ACCESS_KEY
        label: Access key
        default: rustfsadmin
        kind: text
      - key: RUSTFS_SECRET_KEY
        label: Secret key
        description: At least 8 characters.
        kind: secret
    icon: https://templates.provelox.com/icons/rustfs.svg
    composeFile: apps/rustfs/compose.yml
  - id: uptime-kuma
    name: Uptime Kuma
    description: A friendly self-hosted uptime monitor with status pages and notifications.
    category: Monitoring
    mainService: kuma
    port: 3001
    publicWeb: true
    variables: []
    icon: https://templates.provelox.com/icons/uptimekuma.svg
    composeFile: apps/uptime-kuma/compose.yml
  - id: wordpress
    name: WordPress
    description: WordPress with its own MariaDB database. Site files and database are kept on volumes.
    category: Web
    mainService: wordpress
    port: 80
    publicWeb: true
    variables:
      - key: DB_NAME
        label: Database name
        default: wordpress
        kind: text
      - key: DB_USER
        label: Database user
        default: wordpress
        kind: text
      - key: DB_PASSWORD
        label: Database password
        kind: secret
      - key: DB_ROOT_PASSWORD
        label: Database root password
        kind: secret
    icon: https://templates.provelox.com/icons/wordpress.svg
    composeFile: apps/wordpress/compose.yml
  - id: adminer
    name: Adminer
    description: A small web page for browsing and editing databases (PostgreSQL, MySQL and more).
    category: Tools
    mainService: adminer
    port: 8080
    publicWeb: true
    variables: []
    icon: https://templates.provelox.com/icons/adminer.svg
    composeFile: apps/adminer/compose.yml
  - id: ghost
    name: Ghost
    description: A publishing platform for blogs and newsletters, with its own MySQL database.
    category: CMS
    mainService: ghost
    port: 2368
    publicWeb: true
    variables:
      - key: SITE_URL
        label: Public address
        description: The address the site will be opened at, for example https://blog.example.com
        kind: text
      - key: DB_PASSWORD
        label: Database password
        kind: secret
    icon: https://templates.provelox.com/icons/ghost.svg
    composeFile: apps/ghost/compose.yml
  - id: directus
    name: Directus
    description: "A headless CMS and data platform: a ready admin app and API on top of a PostgreSQL database."
    category: CMS
    mainService: directus
    port: 8055
    publicWeb: true
    variables:
      - key: ADMIN_EMAIL
        label: Admin email
        default: admin@example.com
        kind: text
      - key: ADMIN_PASSWORD
        label: Admin password
        kind: secret
      - key: KEY
        label: Instance key
        kind: secret
      - key: SECRET
        label: Signing secret
        kind: secret
      - &a1
        key: DB_PASSWORD
        label: Database password
        kind: secret
    icon: https://templates.provelox.com/icons/directus.svg
    composeFile: apps/directus/compose.yml
  - id: drupal
    name: Drupal
    description: 'Drupal 11 with a PostgreSQL database. In the installer choose PostgreSQL and use the host "db". Open it right after deploying: the first visitor sets it up.'
    category: CMS
    mainService: drupal
    port: 80
    publicWeb: true
    variables:
      - key: DB_NAME
        label: Database name
        default: drupal
        kind: text
      - key: DB_USER
        label: Database user
        default: drupal
        kind: text
      - *a1
    icon: https://templates.provelox.com/icons/drupal.svg
    composeFile: apps/drupal/compose.yml
  - id: joomla
    name: Joomla
    description: "Joomla 5 with a MariaDB database already connected. Open it right after deploying: the first visitor sets it up."
    category: CMS
    mainService: joomla
    port: 80
    publicWeb: true
    variables:
      - key: DB_NAME
        label: Database name
        default: joomla
        kind: text
      - key: DB_USER
        label: Database user
        default: joomla
        kind: text
      - *a1
      - key: DB_ROOT_PASSWORD
        label: Database root password
        kind: secret
    icon: https://templates.provelox.com/icons/joomla.svg
    composeFile: apps/joomla/compose.yml
  - id: n8n
    name: n8n
    description: "Workflow automation: connect apps and APIs with a visual editor. Open it right after deploying: the first visitor sets it up."
    category: Automation
    mainService: n8n
    port: 5678
    publicWeb: true
    variables:
      - key: PUBLIC_URL
        label: Public address
        description: The full address it will be opened at, for example https://n8n.example.com
        kind: text
      - key: N8N_ENCRYPTION_KEY
        label: Encryption key
        description: "Protects saved credentials. Keep it: without it they cannot be read back."
        kind: secret
    icon: https://templates.provelox.com/icons/n8n.svg
    composeFile: apps/n8n/compose.yml
  - id: nocodb
    name: NocoDB
    description: "A spreadsheet-style front end for databases: an open alternative to Airtable. Open it right after deploying: the first visitor sets it up."
    category: Automation
    mainService: nocodb
    port: 8080
    publicWeb: true
    variables:
      - key: NC_AUTH_JWT_SECRET
        label: Signing secret
        kind: secret
    icon: https://templates.provelox.com/icons/nocodb.png
    composeFile: apps/nocodb/compose.yml
  - id: appsmith
    name: Appsmith
    description: "Build internal tools and dashboards on top of your databases and APIs. Open it right after deploying: the first visitor sets it up."
    category: Automation
    mainService: appsmith
    port: 80
    publicWeb: true
    variables: []
    icon: https://templates.provelox.com/icons/appsmith.svg
    composeFile: apps/appsmith/compose.yml
  - id: nextcloud
    name: Nextcloud
    description: File sync and sharing, calendar and contacts, with a PostgreSQL database and an admin account created for you.
    category: Productivity
    mainService: nextcloud
    port: 80
    publicWeb: true
    variables:
      - key: TRUSTED_DOMAIN
        label: Domain
        description: The domain it will be opened on, without https://, for example cloud.example.com
        kind: text
      - key: ADMIN_USER
        label: Admin username
        default: admin
        kind: text
      - key: ADMIN_PASSWORD
        label: Admin password
        kind: secret
