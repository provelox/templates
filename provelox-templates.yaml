    variables:
      - *a1
    icon: https://templates.provelox.com/icons/wikidotjs.svg
    composeFile: apps/wikijs/compose.yml
  - id: memos
    name: Memos
    description: "A lightweight place for quick notes and snippets. Open it right after deploying: the first visitor sets it up."
    category: Productivity
    mainService: memos
    port: 5230
    publicWeb: true
    variables: []
    icon: https://templates.provelox.com/icons/memos.svg
    composeFile: apps/memos/compose.yml
  - id: vaultwarden
    name: Vaultwarden
    description: A small, Bitwarden-compatible password manager server. Works with the Bitwarden apps and browser extensions.
    category: Security
    mainService: vaultwarden
    port: 80
    publicWeb: true
    variables:
      - key: ADMIN_TOKEN
        label: Admin page token
        description: Opens the /admin page. Keep it private.
        kind: secret
      - key: SIGNUPS_ALLOWED
        label: Allow sign-ups
        description: Set to false after you and your people have created accounts.
        default: "true"
        kind: text
    icon: https://templates.provelox.com/icons/vaultwarden.svg
    composeFile: apps/vaultwarden/compose.yml
  - id: keycloak
    name: Keycloak
    description: Single sign-on and identity management (OpenID Connect, SAML) on PostgreSQL, with an admin account created for you.
    category: Security
    mainService: keycloak
    port: 8080
    publicWeb: true
    variables:
      - key: KC_HOSTNAME
        label: Public address
        description: The full address it will be opened at, for example https://login.example.com
        kind: text
      - key: ADMIN_USER
        label: Admin username
        default: admin
        kind: text
      - key: ADMIN_PASSWORD
        label: Admin password
        kind: secret
      - *a1
    icon: https://templates.provelox.com/icons/keycloak.svg
    composeFile: apps/keycloak/compose.yml
  - id: metabase
    name: Metabase
    description: "Business intelligence: ask questions of your data and build dashboards without SQL. Open it right after deploying: the first visitor sets it up."
    category: Analytics
    mainService: metabase
    port: 3000
    publicWeb: true
    variables:
      - *a1
    icon: https://templates.provelox.com/icons/metabase.svg
    composeFile: apps/metabase/compose.yml
  - id: grafana
    name: Grafana
    description: Dashboards and alerts for metrics, logs and databases, with an admin account created for you.
    category: Monitoring
    mainService: grafana
    port: 3000
    publicWeb: true
    variables:
      - key: ADMIN_USER
        label: Admin username
        default: admin
        kind: text
      - key: ADMIN_PASSWORD
        label: Admin password
        kind: secret
    icon: https://templates.provelox.com/icons/grafana.svg
    composeFile: apps/grafana/compose.yml
  - id: gitea
    name: Gitea
    description: "A self-hosted Git service with issues and pull requests, using a built-in database. Git over HTTPS only. Open it right after deploying: the first visitor sets it up."
    category: Development
    mainService: gitea
    port: 3000
    publicWeb: true
    variables: []
    icon: https://templates.provelox.com/icons/gitea.svg
    composeFile: apps/gitea/compose.yml
  - id: open-webui
    name: Open WebUI
    description: "A chat interface for language models: connect it to any OpenAI-compatible API. Open it right after deploying: the first visitor sets it up. The first account becomes the admin."
    category: AI
    mainService: open-webui
    port: 8080
    publicWeb: true
    variables:
      - key: WEBUI_SECRET_KEY
        label: Secret key
        kind: secret
    icon: https://templates.provelox.com/icons/openwebui.svg
    composeFile: apps/open-webui/compose.yml
  - id: langflow
    name: Langflow
    description: Build AI agents and workflows visually. Sign in with the admin account created for you.
    category: AI
    mainService: langflow
    port: 7860
    publicWeb: true
    variables:
      - key: ADMIN_USER
        label: Admin username
        default: admin
        kind: text
      - key: ADMIN_PASSWORD
        label: Admin password
        kind: secret
      - key: SECRET_KEY
        label: Secret key
        kind: secret
    icon: https://templates.provelox.com/icons/langflow.svg
    composeFile: apps/langflow/compose.yml
  - id: anythingllm
    name: AnythingLLM
    description: Chat with your documents using any language model. Protected by the access password you choose.
    category: AI
    mainService: anythingllm
    port: 3001
    publicWeb: true
    variables:
      - key: AUTH_TOKEN
        label: Access password
        kind: secret
      - key: JWT_SECRET
        label: Signing secret
        kind: secret
    icon: https://templates.provelox.com/icons/anythingllm.png
    composeFile: apps/anythingllm/compose.yml
  - id: clickhouse
    name: ClickHouse
    description: A fast column-oriented database for analytics. Data is kept on a volume.
    category: Database
    mainService: clickhouse
    port: 8123
    connect: http://{CLICKHOUSE_USER}:{CLICKHOUSE_PASSWORD}@{host}:{port}/?database={CLICKHOUSE_DB}
    publicWeb: false
    variables:
      - key: CLICKHOUSE_USER
        label: Username
        default: default
        kind: text
      - key: CLICKHOUSE_DB
        label: Database name
        default: app
        kind: text
      - key: CLICKHOUSE_PASSWORD
        label: Password
        kind: secret
    icon: https://templates.provelox.com/icons/clickhouse.svg
    composeFile: apps/clickhouse/compose.yml
  - id: meilisearch
    name: Meilisearch
    description: Fast, typo-tolerant search for your site or app, protected by a master key.
    category: Database
    mainService: meilisearch
    port: 7700
    connect: "http://{host}:{port} (key: {MEILI_MASTER_KEY})"
    publicWeb: false
    variables:
      - key: MEILI_MASTER_KEY
        label: Master key
        description: At least 16 characters. Use it to create narrower keys for your app.
        kind: secret
    icon: https://templates.provelox.com/icons/meilisearch.svg
    composeFile: apps/meilisearch/compose.yml
  - id: strapi
    name: Strapi
    description: "A headless CMS with an admin panel and a REST and GraphQL API, on PostgreSQL. A community-packaged image (Elestio): an empty Strapi to start from. To run your own content types, build your project into an image and deploy it with a Compose file."
    category: CMS
    mainService: strapi
    port: 1337
    publicWeb: true
    variables:
      - key: APP_KEYS
        label: App keys
        kind: secret
      - key: API_TOKEN_SALT
        label: API token salt
        kind: secret
      - key: ADMIN_JWT_SECRET
        label: Admin signing secret
        kind: secret
      - key: TRANSFER_TOKEN_SALT
        label: Transfer token salt
        kind: secret
      - key: JWT_SECRET
        label: Signing secret
        kind: secret
      - *a1
    icon: https://templates.provelox.com/icons/strapi.svg
    composeFile: apps/strapi/compose.yml
  - id: baserow
    name: Baserow
    description: "An open Airtable alternative: build databases and apps without code. Open it right after deploying: the first visitor sets it up."
    category: Automation
    mainService: baserow
    port: 80
    publicWeb: true
    variables:
      - key: BASEROW_PUBLIC_URL
        label: Public address
        description: The address it will be opened at, for example https://tables.example.com
        kind: text
      - key: SECRET_KEY
        label: Secret key
        kind: secret
    icon: https://templates.provelox.com/icons/baserow.svg
    composeFile: apps/baserow/compose.yml
  - id: odoo
    name: Odoo
    description: "Business apps in one place: CRM, sales, invoicing, inventory and more, on PostgreSQL. The first page creates your database. Open it right after deploying: the first visitor sets it up."
    category: Productivity
    mainService: odoo
    port: 8069
    publicWeb: true
    variables:
      - *a1
    icon: https://templates.provelox.com/icons/odoo.svg
    composeFile: apps/odoo/compose.yml
  - id: matomo
    name: Matomo
    description: "Web analytics you own, a privacy-friendly alternative to Google Analytics, on MariaDB. Open it right after deploying: the first visitor sets it up."
    category: Analytics
    mainService: matomo
    port: 80
    publicWeb: true
    variables:
      - *a1
      - key: DB_ROOT_PASSWORD
        label: Database root password
        kind: secret
    icon: https://templates.provelox.com/icons/matomo.svg
    composeFile: apps/matomo/compose.yml
  - id: ollama
    name: Ollama
    description: Run open language models on this server (CPU). Other apps, such as Open WebUI, connect to it privately. It has no login, so it is not published to the internet.
    category: AI
    mainService: ollama
    port: 11434
    connect: http://{host}:{port}
    publicWeb: false
    variables: []
    icon: https://templates.provelox.com/icons/ollama.svg
    composeFile: apps/ollama/compose.yml
  - id: qdrant
    name: Qdrant
    description: A vector database for search and AI apps, protected by an API key.
    category: Database
    mainService: qdrant
    port: 6333
    connect: "http://{host}:{port} (api-key: {API_KEY})"
    publicWeb: false
    variables:
      - key: API_KEY
        label: API key
        kind: secret
    icon: https://templates.provelox.com/icons/qdrant.svg
    composeFile: apps/qdrant/compose.yml
  - id: rabbitmq
    name: RabbitMQ
    description: A message broker for queues and background jobs, with a user and password you choose.
    category: Database
    mainService: rabbitmq
    port: 5672
    connect: amqp://{RABBITMQ_USER}:{RABBITMQ_PASSWORD}@{host}:{port}
    publicWeb: false
    variables:
      - key: RABBITMQ_USER
        label: Username
        default: app
        kind: text
      - key: RABBITMQ_PASSWORD
        label: Password
        kind: secret
    icon: https://templates.provelox.com/icons/rabbitmq.svg
    composeFile: apps/rabbitmq/compose.yml
  - id: mailpit
    name: Mailpit
    description: Catches the email your apps send while you build them, with a web inbox to read it. Apps send to it on port 1025.
    category: Development
    mainService: mailpit
    port: 8025
    publicWeb: true
    variables:
      - key: MAIL_USER
        label: Inbox username
        default: admin
        kind: text
      - key: MAIL_PASSWORD
        label: Inbox password
        kind: secret
    icon: https://templates.provelox.com/icons/mailpit.svg
    composeFile: apps/mailpit/compose.yml
  - id: excalidraw
    name: Excalidraw
    description: A virtual whiteboard for sketching diagrams with a hand-drawn look. Drawings stay in each visitor's browser.
    category: Productivity
    mainService: excalidraw
    port: 80
    publicWeb: true
    variables: []
    icon: https://templates.provelox.com/icons/excalidraw.svg
    composeFile: apps/excalidraw/compose.yml
  - id: it-tools
    name: IT-Tools
    description: "Handy tools for developers and IT people: converters, generators, encoders and more. Everything runs in the browser."
    category: Tools
    mainService: it-tools
    port: 80
    publicWeb: true
    variables: []
    icon: https://templates.provelox.com/icons/ittools.png
    composeFile: apps/it-tools/compose.yml
  - id: stirling-pdf
    name: Stirling PDF
    description: Merge, split, convert, compress and sign PDFs from a web page, on your own server.
    category: Tools
    mainService: stirling-pdf
    port: 8080
    publicWeb: true
    variables: []
    icon: https://templates.provelox.com/icons/stirlingpdf.svg
    composeFile: apps/stirling-pdf/compose.yml
  - id: actual-budget
    name: Actual Budget
    description: "A private, local-first budgeting app that syncs across your devices. Open it right after deploying: the first visitor sets it up."
    category: Productivity
    mainService: actual
    port: 5006
    publicWeb: true
    variables: []
    icon: https://templates.provelox.com/icons/actualbudget.svg
    composeFile: apps/actual-budget/compose.yml
  - id: mealie
    name: Mealie
    description: A recipe manager and meal planner. Sign in with the admin account created for you.
    category: Productivity
    mainService: mealie
    port: 9000
    publicWeb: true
    variables:
      - &a2
        key: ADMIN_EMAIL
        label: Admin email
        default: admin@example.com
        kind: text
      - &a3
        key: ADMIN_PASSWORD
        label: Admin password
        kind: secret
    icon: https://templates.provelox.com/icons/mealie.svg
    composeFile: apps/mealie/compose.yml
  - id: linkding
    name: Linkding
    description: A minimal bookmark manager with tags and search, with an admin account created for you.
    category: Productivity
    mainService: linkding
    port: 9090
    publicWeb: true
    variables:
      - key: ADMIN_USER
        label: Admin username
        default: admin
        kind: text
      - key: ADMIN_PASSWORD
        label: Admin password
        kind: secret
    icon: https://templates.provelox.com/icons/linkding.svg
    composeFile: apps/linkding/compose.yml
  - id: docuseal
    name: DocuSeal
    description: "Create, fill and sign documents online: an open alternative to DocuSign. Open it right after deploying: the first visitor sets it up."
    category: Productivity
    mainService: docuseal
    port: 3000
    publicWeb: true
    variables:
      - key: SECRET_KEY_BASE
        label: Secret key
        kind: secret
    icon: https://templates.provelox.com/icons/docuseal.svg
    composeFile: apps/docuseal/compose.yml
  - id: firefly-iii
    name: Firefly III
    description: "Personal finance manager: track spending, budgets and accounts, on PostgreSQL. Open it right after deploying: the first visitor sets it up."
    category: Productivity
    mainService: firefly
    port: 8080
    publicWeb: true
    variables:
      - key: PUBLIC_URL
        label: Public address
        description: The full address it will be opened at, for example https://money.example.com
        kind: text
      - *a2
      - key: APP_KEY
        label: App key
        description: "Exactly 32 characters. Keep it: data is encrypted with it."
        kind: secret
        minLength: 32
